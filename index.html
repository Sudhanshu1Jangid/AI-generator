<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a review</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --text:#1a1d21; --muted:#6b7280; --accent:#1a73e8; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2025; --text:#eef0f3; --muted:#9aa1ab; --accent:#6ea8fe; --line:#2c3037; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--text); padding:8px 14px; border-radius:999px; font:inherit; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary { width:100%; margin-top:18px; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.primary:disabled { opacity:.6; }
  button.link { background:none; border:0; color:var(--accent); font:inherit; cursor:pointer; padding:8px 0; }
  textarea { width:100%; min-height:130px; padding:12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--text); font:inherit; resize:vertical; }
  #result { display:none; margin-top:16px; }
  .msg { color:var(--muted); font-size:.9rem; margin-top:8px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1 id="bizName"></h1>
  <p class="sub">Pick a few options. We'll draft a review you can edit and post.</p>

  <div class="card">
    <label>What did you like?</label>
    <div class="chips" id="highlights"></div>

    <label>Language</label>
    <div class="chips" id="languages"></div>

    <label>Tone</label>
    <div class="chips" id="tones"></div>

    <button class="primary" id="gen">Generate review</button>
  </div>

  <div class="card" id="result">
    <textarea id="review" aria-label="Your review"></textarea>
    <button class="primary" id="copy">Copy and open Google review</button>
    <button class="link" id="again">Generate another</button>
    <p class="msg" id="msg"></p>
  </div>
</main>

<script>
/* ---- EDIT THIS PART FOR EACH BUSINESS ---- */
const CONFIG = {
  business: "Your Business Name",
  placeId: "ChIJDa_-x7ezbTkRvOcCtCu1gQc", // find it: https://developers.google.com/maps/documentation/places/web-service/place-id
  highlights: ["Friendly staff", "Great service", "Clean place", "Good value", "Quick and easy"],
  languages: ["English", "Hindi", "Hinglish"],
  tones: ["Friendly", "Professional", "Short and simple", "Enthusiastic"],
};
/* ------------------------------------------ */

const $ = (id) => document.getElementById(id);
const state = { highlights: new Set(), language: CONFIG.languages[0], tone: CONFIG.tones[0] };
$("bizName").textContent = CONFIG.business;
document.title = "Review " + CONFIG.business;

function chips(el, items, multi, onChange) {
  items.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t; b.type = "button";
    b.setAttribute("aria-pressed", !multi && i === 0 ? "true" : "false");
    b.onclick = () => {
      if (multi) {
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", on);
        onChange(t, on);
      } else {
        el.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        onChange(t);
      }
    };
    el.appendChild(b);
  });
}
chips($("highlights"), CONFIG.highlights, true, (t, on) => on ? state.highlights.add(t) : state.highlights.delete(t));
chips($("languages"), CONFIG.languages, false, (t) => (state.language = t));
chips($("tones"), CONFIG.tones, false, (t) => (state.tone = t));

async function generate() {
  $("gen").disabled = true; $("gen").textContent = "Writing...";
  $("msg").textContent = "";
  try {
    const r = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        business: CONFIG.business, language: state.language, tone: state.tone,
        highlights: [...state.highlights],
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Failed");
    $("review").value = d.review;
    $("result").style.display = "block";
    $("result").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    alert("Couldn't generate a review. Please try again.");
  }
  $("gen").disabled = false; $("gen").textContent = "Generate review";
}
$("gen").onclick = generate;
$("again").onclick = generate;

$("copy").onclick = async () => {
  const text = $("review").value;
  try { await navigator.clipboard.writeText(text); }
  catch { $("review").select(); document.execCommand("copy"); }
  $("msg").textContent = "Copied. Paste it in the review box.";
  setTimeout(() => {
    window.location.href = "https://search.google.com/local/writereview?placeid=" + CONFIG.placeId;
  }, 600);
};
</script>
</body>
</html>
